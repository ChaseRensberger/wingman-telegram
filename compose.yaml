services:
  telegram:
    image: ${TELEGRAM_IMAGE:?Set TELEGRAM_IMAGE to your GHCR image}
    pull_policy: always
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-}
      WINGMAN_URL: ${WINGMAN_URL:-}
      WINGMAN_USERNAME: ${WINGMAN_USERNAME:-wingman}
      WINGMAN_PASSWORD: ${WINGMAN_PASSWORD:-}
      WINGMAN_AGENT_ID: ${WINGMAN_AGENT_ID:-}
      WINGMAN_MODEL_REF: ${WINGMAN_MODEL_REF:-}
      WINGMAN_WORKDIR: ${WINGMAN_WORKDIR:-}
      WINGMAN_CONSOLE_URL: ${WINGMAN_CONSOLE_URL:-}
    volumes:
      - telegram-state:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  telegram-state:
